[workspace]
resolver = "3"
members = ["core/sqmeow-rpc", "core/sqmeow-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/2giosangmitom/sqmeow.nvim"

[workspace.dependencies]
sqmeow-rpc = { path = "core/sqmeow-rpc" }

rmpv = "1.3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
