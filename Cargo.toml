[workspace]
resolver = "3"
members = ["core/sqmeow-rpc", "core/sqmeow-db", "core/sqmeow-adapters", "core/sqmeow-core"]

[workspace.package]
version = "2.5.0" # x-release-please-version
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/2giosangmitom/sqmeow.nvim"

[workspace.dependencies]
async-trait = "0.1"
sqmeow-rpc = { path = "core/sqmeow-rpc" }
sqmeow-db = { path = "core/sqmeow-db" }
sqmeow-adapters = { path = "core/sqmeow-adapters" }

rmpv = "1.3"
rstest = { version = "0.27", default-features = false }
thiserror = "2"
tokio = { version = "1.53", default-features = false }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false }
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1.27"
mysql_async = { version = "0.37", default-features = false, features = [
  "minimal-rust",
  "rustls-tls",
  "ring",
  "tls12",
  "client_ed25519",
] }
tokio-postgres = { version = "0.7", features = [
  "with-chrono-0_4",
  "with-serde_json-1",
  "with-uuid-1",
] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rusqlite = { version = "0.40", default-features = false, features = [
  "column_decltype",
  "column_metadata",
  "hooks",
] }
redis = { version = "1.7", default-features = false, features = [
  "tokio-rustls-comp",
  "tls-rustls-insecure",
  "cluster-async",
  "sentinel",
] }
mongodb = "3.9"
duckdb = { version = "1.10506", features = ["chrono"] }
scylla = { version = "1.9", features = [
  "chrono-04",
  "bigdecimal-04",
  "num-bigint-04",
  "rustls-023",
] }
surrealdb = { version = "3.3", default-features = false, features = ["protocol-ws", "rustls"] }
clickhouse = { version = "0.15", default-features = false, features = [
  "rustls-tls-ring",
  "rustls-tls-native-roots",
] }
oracledb = "26.0.0-beta.4"
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sqlparser = { version = "0.63", default-features = false, features = ["std", "visitor"] }
percent-encoding = "2"
url = "2"
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "tracing-log",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
