[workspace]
resolver = "3"
members = [
  "core/sqmeow-rpc",
  "core/sqmeow-db",
  "core/sqmeow-adapters",
  "core/sqmeow-core",
]

[workspace.package]
# Bumped by release-please, which finds the line by the annotation rather than by its
# position, so the comment is load-bearing.
version = "1.0.2" # x-release-please-version
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/2giosangmitom/sqmeow.nvim"

[workspace.dependencies]
sqmeow-rpc = { path = "core/sqmeow-rpc" }
sqmeow-db = { path = "core/sqmeow-db" }
sqmeow-adapters = { path = "core/sqmeow-adapters" }

rmpv = "1.3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
unicode-width = "0.2"
futures-util = { version = "0.3", default-features = false }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  # Native roots rather than a bundled set: people connect to company servers whose certificate
  # chains are trusted by the machine and by nothing else.
  "tls-rustls-ring-native-roots",
  # Without these, a NUMERIC, a UUID, a JSON column or a timestamp cannot be decoded at all,
  # which are exactly the columns real schemas are full of.
  "bigdecimal",
  "chrono",
  "json",
  "uuid",
] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
