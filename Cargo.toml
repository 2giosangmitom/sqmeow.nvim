[workspace]
resolver = "3"
members = ["core/sqmeow-rpc", "core/sqmeow-db", "core/sqmeow-adapters", "core/sqmeow-core"]

[workspace.package]
version = "2.1.0" # x-release-please-version
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/2giosangmitom/sqmeow.nvim"

[workspace.dependencies]
sqmeow-rpc = { path = "core/sqmeow-rpc" }
sqmeow-db = { path = "core/sqmeow-db" }
sqmeow-adapters = { path = "core/sqmeow-adapters" }

rmpv = "1.3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
unicode-width = "0.2"
futures-util = { version = "0.3", default-features = false }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  # Native roots rather than a bundled set: people connect to company servers whose certificate
  # chains are trusted by the machine and by nothing else.
  "tls-rustls-ring-native-roots",
  # Without these, a NUMERIC, a UUID, a JSON column or a timestamp cannot be decoded at all,
  # which are exactly the columns real schemas are full of.
  "bigdecimal",
  "chrono",
  "json",
  "uuid",
] }
redis = { version = "1.7", default-features = false, features = [
  "tokio-rustls-comp",
  "tls-rustls-insecure",
  "cluster-async",
  "sentinel",
] }
# The official driver. Its rustls trusts a bundled set of roots and has no native-roots feature, so a
# server behind a private CA is reached with `tlsCAFile=` in the URL. DNS is on for `mongodb+srv`.
mongodb = "3.9"
# Links the machine's libduckdb (CI installs DuckDB's prebuilt one); release builds bundle it with `bundled-duckdb`.
duckdb = { version = "1.10505", features = ["chrono"] }
# CQL, for ScyllaDB and Apache Cassandra alike.
scylla = { version = "1.8", features = [
  "chrono-04",
  "bigdecimal-04",
  "num-bigint-04",
  "rustls-023",
] }
# The official SDK, over WebSocket only: no embedded storage engines.
surrealdb = { version = "3.2", default-features = false, features = ["protocol-ws", "rustls"] }
# ClickHouse over HTTP(S), with the same crypto provider and machine roots as sqlx.
clickhouse = { version = "0.15", default-features = false, features = [
  "rustls-tls-ring",
  "rustls-tls-native-roots",
] }
# TLS for ScyllaDB, with the same crypto provider and roots as sqlx.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
csv = "1.4"
# Reads a query's FROM aliases, and parses the filters typed for results held in memory.
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
# The version sqlx's SQLite driver links, for `sqlite3_interrupt`, which sqlx does not expose.
libsqlite3-sys = "0.37"
percent-encoding = "2"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# A panic stays in the request task that raised it instead of ending every connection.
panic = "unwind"

# Most of the binary is DuckDB's C++, whose queries run about twice as slow when built for size.
[profile.release.package.libduckdb-sys]
opt-level = 3
