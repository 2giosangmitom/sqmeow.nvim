# Databases for the integration tests. Ports are deliberately non-standard so this never collides
# with a server the developer already runs.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sqmeow
      POSTGRES_PASSWORD: sqmeow
      POSTGRES_DB: sqmeow
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqmeow"]
      interval: 2s
      timeout: 3s
      retries: 30

  # CockroachDB speaks the PostgreSQL protocol, so the PostgreSQL adapter serves it.
  cockroach:
    image: cockroachdb/cockroach:v26.2.6
    command: start-single-node --insecure
    ports:
      - "56257:26257"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health?ready=1"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Speaks the PostgreSQL protocol but ignores `default_transaction_read_only`.
  questdb:
    image: questdb/questdb:10.0.1
    ports:
      - "58812:8812"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/exec?query=select%201"]
      interval: 2s
      timeout: 3s
      retries: 60

  # The tests connect as root: MySQL 8 keeps binary logging on, so creating a stored function
  # needs SUPER, which an ordinary account does not have.
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: sqmeow
      MYSQL_DATABASE: sqmeow
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-psqmeow"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: sqmeow
      CLICKHOUSE_PASSWORD: sqmeow
      # Lets the tests create a function and read users and roles.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "58123:8123"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Dragonfly speaks the Redis protocol, and the Redis cases run against it as well. It locks its
  # memory on start, which Docker's default limit refuses. The image brings its own healthcheck.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2
    ulimits:
      memlock: -1
    ports:
      - "56380:6379"

  # Three primaries and three replicas in one container, announcing 127.0.0.1 so the client can follow
  # a redirect to the published port.
  redis-cluster:
    image: grokzen/redis-cluster:7.0.10
    environment:
      IP: 127.0.0.1
      # Below 55535, since each node's cluster bus listens 10000 ports higher.
      INITIAL_PORT: "47000"
    ports:
      - "47000-47005:47000-47005"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 47000 cluster info | grep -q cluster_state:ok"]
      interval: 2s
      timeout: 3s
      retries: 60

  # A master and a Sentinel watching it, in one container, so the Sentinel names an address the
  # host can reach.
  redis-sentinel:
    image: redis:8-alpine
    command:
      - sh
      - -c
      - >-
        redis-server --port 56390 --daemonize yes &&
        printf 'port 56391\nsentinel monitor sqmeow 127.0.0.1 56390 1\n' > /tmp/sentinel.conf &&
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - "56390:56390"
      - "56391:56391"
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -p 56391 sentinel get-master-addr-by-name sqmeow | grep -q 56390"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongodb:
    image: mongo:8
    ports:
      - "57017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ScyllaDB and Cassandra both speak CQL, and the CQL cases run against each. Both take a minute to start.
  scylla:
    image: scylladb/scylla:2025.3
    # Advertise the host's address, or the driver dials the container's IP on the published port.
    command: --smp 1 --memory 512M --overprovisioned 1 --developer-mode 1 --broadcast-rpc-address 127.0.0.1
    ports:
      - "59042:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 5s
      timeout: 5s
      retries: 60

  cassandra:
    image: cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
    ports:
      - "59043:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 5s
      timeout: 5s
      retries: 60

  surrealdb:
    image: surrealdb/surrealdb:v3
    command: start --user root --pass root memory
    ports:
      - "58000:8000"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 2s
      timeout: 3s
      retries: 30
