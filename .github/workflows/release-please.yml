name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest

    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      # GitHub starts no workflow for events made with the workflow's own token, so the release PR
      # (titled `chore(release): v<version>`) only gets its release build in `release.yml` when
      # it is opened and pushed with `RELEASE_PLEASE_TOKEN`: a fine-grained PAT or GitHub App
      # token with contents and pull-requests write access. Without it, release-please still
      # works but the release PR is not built until the release itself.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          # The same token, so the Cargo.lock push below also rebuilds the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.pr

      # Release builds use --locked, so keep Cargo.lock on the release PR current.
      # `cargo update` only resolves manifests, so no database libraries are needed.
      - name: Sync Cargo.lock
        if: steps.release.outputs.pr
        run: |
          set -euo pipefail
          cargo update --workspace --quiet
          git diff --quiet -- Cargo.lock && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync Cargo.lock with the released version' -- Cargo.lock
          git push

  # The release tag is created by release-please, so it is built and published from here rather
  # than by a tag-push trigger, which would not fire for the workflow token and would publish
  # twice for a PAT.
  release:
    name: release
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-please.outputs.tag }}
