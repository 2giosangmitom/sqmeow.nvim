name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest

    outputs:
      pr: ${{ steps.release.outputs.pr }}
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps Cargo.toml but not Cargo.lock, and release builds use `--locked`.
  lockfile:
    name: lockfile
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}

      # The pinned toolchain from mise.toml, so the synced lockfile never needs a
      # newer rust than the repo builds with.
      - uses: jdx/mise-action@v2

      - name: Sync Cargo.lock
        run: |
          set -euo pipefail
          cargo update --workspace --quiet
          git diff --quiet -- Cargo.lock && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync Cargo.lock with the released version' -- Cargo.lock
          git push

  # A tag pushed with the workflow token starts no workflow, so the build is called directly.
  release:
    name: release
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-please.outputs.tag }}
