name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: smaller cache, faster links.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # The pinned toolchain from mise.toml: rust, just, stylua, selene, lua-language-server.
      - uses: jdx/mise-action@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2

      # Also installs the plugins lua-language-server checks against.
      - run: just docs-check
      - run: just lint

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # The pinned toolchain from mise.toml: rust, just, stylua, selene, lua-language-server.
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2

      # DuckDB's prebuilt libduckdb instead of compiling it. It lives outside target/, which the
      # cache prunes; libduckdb-sys 1.MMmmpp.x wraps DuckDB MM.mm.pp.
      - name: Install libduckdb
        run: |
          set -euo pipefail
          n=$(grep -A1 '^name = "libduckdb-sys"$' Cargo.lock | sed -n 's/^version = "1\.\([0-9]*\)\..*/\1/p')
          version="$((n / 10000)).$((n / 100 % 100)).$((n % 100))"
          curl -fsSL -o "$RUNNER_TEMP/libduckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v$version/libduckdb-linux-amd64.zip"
          sudo unzip -o "$RUNNER_TEMP/libduckdb.zip" libduckdb.so -d /usr/local/lib
          sudo ldconfig
          echo "DUCKDB_LIB_DIR=/usr/local/lib" >> "$GITHUB_ENV"

      # The databases come from compose.yaml, on the same ports and with the same
      # server-backed URLs `just test-rust` and `just test-lua` use locally.
      - run: just db-up
      - run: just test-rust
      - run: just test-lua
