name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The runners have no libduckdb.
  SQMEOW_CARGO_FLAGS: --features bundled-duckdb

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # The pinned toolchain from mise.toml: rust, just, stylua, selene, lua-language-server.
      - uses: jdx/mise-action@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2

      # Also installs the plugins lua-language-server checks against.
      - run: just docs-check
      - run: just lint

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # The pinned toolchain from mise.toml: rust, just, stylua, selene, lua-language-server.
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2

      # The databases come from compose.yaml, on the same ports and with the same
      # server-backed URLs `just test-rust` and `just test-lua` use locally.
      - run: just db-up
      - run: just test-rust
      - run: just test-lua
