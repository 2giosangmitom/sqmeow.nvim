name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: smaller cache, faster links.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}
          # Keep downloaded crates, not the large compiled target/ directory.
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Also installs the plugins lua-language-server checks against.
      - run: nix develop --command just docs-check
      - run: nix develop --command just lint
      - run: nix develop --command just db-up
      - run: nix develop --command just test
