name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQMEOW_TEST_POSTGRES_URL: postgres://sqmeow:sqmeow@127.0.0.1:5432/sqmeow
  SQMEOW_TEST_MYSQL_URL: mysql://sqmeow:sqmeow@127.0.0.1:3306/sqmeow

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest

    # The adapter tests talk to real servers. A stub would prove the adapters agree with the stub.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sqmeow
          POSTGRES_PASSWORD: sqmeow
          POSTGRES_DB: sqmeow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqmeow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: sqmeow
          MYSQL_DATABASE: sqmeow
          MYSQL_USER: sqmeow
          MYSQL_PASSWORD: sqmeow
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -psqmeow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  lua:
    name: lua
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sqmeow
          POSTGRES_PASSWORD: sqmeow
          POSTGRES_DB: sqmeow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqmeow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: sqmeow
          MYSQL_DATABASE: sqmeow
          MYSQL_USER: sqmeow
          MYSQL_PASSWORD: sqmeow
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -psqmeow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

      - uses: NTBBloodbath/selene-action@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: lua plugin telescope tests

      # The suite drives a real engine over a real channel, so it needs one built first.
      - run: cargo build
      - run: git clone --filter=blob:none --depth 1 https://github.com/nvim-mini/mini.nvim .deps/mini.nvim
      # A data directory of its own, because scratchpads live under `stdpath('data')`.
      - run: nvim --headless -u tests/minimal_init.lua -c "lua require('mini.test').setup(); MiniTest.run()"
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/sqmeow-data

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - run: git clone --filter=blob:none --depth 1 https://github.com/nvim-mini/mini.nvim .deps/mini.nvim

      # The help file is committed, because plugin managers do not run build steps and
      # `:help sqmeow` has to work on a fresh install. This is what keeps it current: a pull
      # request that changes an annotation without regenerating fails here.
      - run: nvim --headless -u scripts/minidoc_init.lua -c "lua require('mini.doc').generate()" -c "qa!"
      - run: git diff --exit-code doc/
