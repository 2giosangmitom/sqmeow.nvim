name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish.
        required: true
        type: string
  # Release PRs (`chore(release): v<version>`, see `pull-request-title-pattern`) build every
  # target without publishing, so a broken build shows up before the merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

# A newer push to the release PR supersedes its running build; releases never cancel.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.pull_request.number) || format('release-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  build:
    name: ${{ matrix.target }}
    if: github.event_name != 'pull_request' || startsWith(github.event.pull_request.title, 'chore(release):')
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so the binary does not depend on the distribution's glibc.
          # SQLite/DuckDB compile from bundled sources (`--features bundled`),
          # so no system database libraries are needed. `just dist-build-musl`
          # builds these in Docker with a C++ toolchain new enough for DuckDB.
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-latest, musl: true }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }

    steps:
      - uses: actions/checkout@v7
        with:
          # The PR head rather than GitHub's merge commit: that is what the merge releases.
          ref: ${{ github.event.pull_request.head.sha || env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache compiled dependencies, mostly the bundled DuckDB C++ build; rust-cache leaves out the
      # workspace's own artifacts. Save only from master runs (the release build called by Release
      # Please): other refs cannot restore a PR's or a tag's cache, and release PRs restore these.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@v2
        if: matrix.musl
        with:
          tool: just

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.musl }}" = true ]; then
            just dist-build-musl ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }} -p sqmeow-core --features bundled
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="sqmeow-core-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"

          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="dist/$name.zip"
            7z a "$archive" "./$dir/sqmeow-core.exe"
          else
            archive="dist/$name.tar.gz"
            tar -czf "$archive" -C "$dir" sqmeow-core
          fi

          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" | awk '{print $1}' > "$archive.sha256"
          else
            shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: publish
    needs: build
    # Release PR builds only check that every target builds.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          # A release-please release already has notes from the changelog.
          generate_release_notes: false
