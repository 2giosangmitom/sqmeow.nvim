name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build and attach the archives to
        required: true
        type: string
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach the archives to
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so the binary does not depend on the distribution's glibc.
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, runner: macos-latest }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }} -p sqmeow-core

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="sqmeow-core-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"

          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="dist/$name.zip"
            7z a "$archive" "./$dir/sqmeow-core.exe"
          else
            archive="dist/$name.tar.gz"
            tar -czf "$archive" -C "$dir" sqmeow-core
          fi

          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" | awk '{print $1}' > "$archive.sha256"
          else
            shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  manifest:
    name: manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Read by install.lua to pick an archive and verify its hash.
      - name: Write manifest.json
        run: |
          python3 - "$TAG" "https://github.com/${{ github.repository }}/releases/download/$TAG" <<'PY'
          import hashlib, json, os, sys

          tag, base = sys.argv[1], sys.argv[2]
          targets = {}
          for name in sorted(os.listdir('dist')):
              if name.endswith('.sha256'):
                  continue
              path = os.path.join('dist', name)
              triple = name.removeprefix('sqmeow-core-').removesuffix('.tar.gz').removesuffix('.zip')
              sha256 = open(path + '.sha256').read().strip()
              actual = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              assert actual == sha256, f'{name}: {actual} != {sha256}'
              targets[triple] = {'url': f'{base}/{name}', 'sha256': sha256, 'size': os.path.getsize(path)}

          with open('dist/manifest.json', 'w') as out:
              json.dump({'version': tag.lstrip('v'), 'targets': targets}, out, indent=2)
              out.write('\n')
          PY
          cat dist/manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          # A release-please release already has notes from the changelog.
          generate_release_notes: ${{ !inputs.tag }}
