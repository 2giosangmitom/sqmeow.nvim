name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish. Leave empty when not publishing.
        required: false
        type: string
      ref:
        description: Commit to build instead of the tag, e.g. the release PR head.
        required: false
        type: string
      publish:
        description: Upload the archives to a GitHub release. `false` only checks that every target builds.
        required: false
        type: boolean
        default: true
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so the binary does not depend on the distribution's glibc.
          # SQLite/DuckDB compile from bundled sources (`--features bundled`),
          # so no system database libraries are needed.
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache compiled dependencies, mostly the bundled DuckDB C++ build; rust-cache leaves out the
      # workspace's own artifacts. Save only from master runs: other refs cannot restore a PR's or
      # a tag's cache. The release PR build runs in the master-triggered Release Please workflow
      # with the Cargo.lock the merge will have, so it saves the key the release build restores.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }} -p sqmeow-core --features bundled

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="sqmeow-core-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"

          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="dist/$name.zip"
            7z a "$archive" "./$dir/sqmeow-core.exe"
          else
            archive="dist/$name.tar.gz"
            tar -czf "$archive" -C "$dir" sqmeow-core
          fi

          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" | awk '{print $1}' > "$archive.sha256"
          else
            shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: publish
    needs: build
    # `inputs.publish` is null for tag pushes and manual runs, which always publish.
    if: inputs.publish != false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          # A release-please release already has notes from the changelog.
          generate_release_notes: ${{ !inputs.tag }}
