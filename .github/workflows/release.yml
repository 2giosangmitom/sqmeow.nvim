name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build and attach the archives to
        required: true
        type: string
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach the archives to
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so the binary does not depend on the distribution's glibc.
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, runner: macos-latest }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }} -p sqmeow-core --features bundled-duckdb

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="sqmeow-core-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"

          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="dist/$name.zip"
            7z a "$archive" "./$dir/sqmeow-core.exe"
          else
            archive="dist/$name.tar.gz"
            tar -czf "$archive" -C "$dir" sqmeow-core
          fi

          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" | awk '{print $1}' > "$archive.sha256"
          else
            shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          # A release-please release already has notes from the changelog.
          generate_release_notes: ${{ !inputs.tag }}
