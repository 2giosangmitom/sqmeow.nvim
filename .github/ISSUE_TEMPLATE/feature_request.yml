name: Feature request
description: Suggest an improvement to sqmeow.nvim
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do, and where do you get stuck?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should sqmeow.nvim do?
      description: Give an example query, command, or interaction.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds and affected databases
      description: How do you handle this now? Which databases do you use for this task?
