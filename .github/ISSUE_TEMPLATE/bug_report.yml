name: Bug report
description: Report a bug in sqmeow.nvim
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did sqmeow.nvim do, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the steps, query, and config needed to reproduce the bug. Remove credentials and private data.
      placeholder: |
        1. Connect to...
        2. Run this query...
        3. Press...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the database version for connection or query bugs.
      placeholder: |
        OS:
        Neovim version:
        sqmeow.nvim tag or commit:
        Database and version:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste output from :checkhealth sqmeow or :Sqmeow messages, or attach a screenshot. Remove credentials and private data.
