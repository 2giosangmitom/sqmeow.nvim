name: Bug report
description: Report a bug in sqmeow.nvim
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/2giosangmitom/sqmeow.nvim/issues) before opening a new one. Remove credentials and private data from anything you paste.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did sqmeow.nvim do, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest steps, query, and config that still show the bug. A minimal config helps rule out plugin conflicts.
      placeholder: |
        1. Connect to...
        2. Run this query...
        3. Press...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the database and version for connection or query bugs.
      placeholder: |
        OS:
        Neovim version:
        sqmeow.nvim tag or commit:
        Engine version (from :checkhealth sqmeow):
        Database and version:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste output from :checkhealth sqmeow or :Sqmeow messages. Attach a screenshot or recording for UI bugs.
