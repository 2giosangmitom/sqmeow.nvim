[package]
name = "sqmeow-adapters"
description = "Database adapters for sqmeow.nvim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Compile DuckDB from source instead of linking the machine's libduckdb. `json` has
# `json_serialize_sql`, which finds the table an editable result came from.
bundled-duckdb = ["duckdb/bundled", "duckdb/json"]

[dependencies]
sqmeow-db.workspace = true

duckdb.workspace = true
futures-util.workspace = true
libsqlite3-sys.workspace = true
mongodb.workspace = true
percent-encoding.workspace = true
redis.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
scylla.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["mysql", "postgres", "sqlite"] }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
