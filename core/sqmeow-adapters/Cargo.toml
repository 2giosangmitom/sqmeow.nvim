[package]
name = "sqmeow-adapters"
description = "Database adapters for sqmeow.nvim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
sqmeow-db.workspace = true

bigdecimal.workspace = true
chrono.workspace = true
clickhouse.workspace = true
duckdb.workspace = true
futures-util.workspace = true
mongodb.workspace = true
mysql_async.workspace = true
oracledb.workspace = true
percent-encoding.workspace = true
redis.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rusqlite.workspace = true
scylla.workspace = true
serde_json.workspace = true
surrealdb.workspace = true
tiberius.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util"] }
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
rstest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# Release archives link SQLite/DuckDB from compiled sources instead of the
# dev shell's shared libraries. Dev/test/lint builds omit this feature and
# stay dynamic.
[features]
bundled = ["duckdb/bundled", "rusqlite/bundled"]
