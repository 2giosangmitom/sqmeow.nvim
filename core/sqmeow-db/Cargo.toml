[package]
name = "sqmeow-db"
description = "Database value model, adapter contract, and connection registry for sqmeow.nvim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
sqlparser.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
polars = { version = "0.55.2", default-features = false, features = ["lazy", "strings", "object", "dtype-i128"] }
polars-utils = { version = "0.55.2", default-features = false }
# Enable IO and SQL features directly: the facade's CSV/JSON features also
# enable the streaming engine, which is not used by in-memory views.
polars-io = { version = "0.55.2", default-features = false, features = ["csv", "json"] }
# Preserve SQL JSON expressions without enabling streaming.
polars-sql = { version = "0.55.2", default-features = false, features = ["json"] }

[dev-dependencies]
rstest.workspace = true
