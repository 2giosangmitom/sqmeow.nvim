[package]
name = "sqmeow-db"
description = "Database value model, adapter contract, and connection registry for sqmeow.nvim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json.workspace = true
sqlparser.workspace = true
unicode-width.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
polars = { version = "0.55.2", default-features = false, features = [
  "lazy",
  "strings",
] }
# Enable IO and SQL features directly: the facade's CSV/JSON features also
# enable the streaming engine, which is not used by in-memory views.
polars-io = { version = "0.55.2", default-features = false, features = ["csv", "json"] }
# Preserve SQL JSON expressions without enabling streaming.
polars-sql = { version = "0.55.2", default-features = false, features = ["json"] }
